baseURL = 'https://minsoehan.com/'
locale = 'en-us'
title = 'Min Soe Han'
summaryLength = 9

[params]
    [params.add]
        search = false
        overtimeformula = false
        filetree = false
        codeblock = false

[minify]
    minifyOutput = true

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.parser]
            [markup.goldmark.parser.attribute]
                block = true
                title = true
    [markup.highlight]
        style = 'github-dark'

[menus]
    [[menus.main]]
        name = 'Tech'
        pageRef = '/tech'
        weight = 1
    [[menus.main]]
        name = 'Legal'
        pageRef = '/legal'
        post = '<i class="fa-solid fa-chevron-down has-children-indicator"></i>'
        weight = 2
    [[menus.main]]
        name = 'Labor Laws'
        pageRef = '/legal/labor-laws'
        parent = 'Legal'
        weight = 1
    [[menus.main]]
        name = 'Investment'
        pageRef = '/legal/investment'
        parent = 'Legal'
        weight = 2
    [[menus.main]]
        name = 'Open Diary'
        pageRef = '/open-diary'
        weight = 3
    [[menus.main]]
        name = 'Others'
        pageRef = '/others'
        weight = 4
    [[menus.main]]
        name = 'About'
        pageRef = '/about'
        weight = 5
